schema_version: "0.1"
catalog_id: equipment_catalog_v1
review_status: draft_for_expert_review
source_checked_at: 2026-10-10
scope_note_uk: >-
  Мінімальний демонстраційний whitelist для покриття RO, DI, TRIAC, PWM і
  DALI_ADDRESS. Каталог не є робочим проєктом, не перевіряє навантаження
  та не замінює підбір живлення, захисту, кабелів і пусконалагодження.
stacks:
  i3:
    mandatory_product_ids:
      - i3.atom_cobalt
    external_prerequisites:
      - external:dc_power_supply_sized_by_integrator
    policy_status: expert_assumption
    policy_note_uk: >-
      Atom Cobalt використовується як базовий контролер MVP. Тип і потужність
      зовнішнього DC-живлення визначає інтегратор після підрахунку споживання.
  knx:
    mandatory_product_ids:
      - knx.mdt_stv_0640_02
      - knx.mdt_scn_ip000_03
    external_prerequisites:
      - external:ets_commissioning
    policy_status: expert_assumption
    policy_note_uk: >-
      Для демонстраційного KNX-варіанта включаються блок живлення шини 640 mA
      та IP-інтерфейс. Фактичне споживання шини і топологія перевіряються інженером.

      "object": "assessment or current room/location fields",
      "system_recommendation": "parent system recommendation fields",
      "function": "derived function recommendation fields",
      "factors": "the current function factors"
    },
    "operators": [
      "equals",
      "not_equals",
      "contains",
      "not_contains",
      "in",
      "gte",
      "lte",
      "exists"
    ],
    "expression_nodes": [
      "all",
      "any"
    ],
    "missing_value_result": "unknown",
    "note": "A leaf is {source, field, operator, value}; all/any nodes may be nested. value is optional only for exists."

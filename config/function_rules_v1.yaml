  "fallback_rule": {
    "applicability": {
      "false_result": {
        "status": "not_applicable",
        "recommended_phase": null,
        "needs_review": false
      },
      "unknown_result": {
        "status": "inherit_system_status",
        "needs_review": true
      },
      "true_result": "evaluate_relevance"
    },
    "relevance": {
      "match_status_map": {
        "recommended": "recommended",
        "optional": "recommended",
        "inexpedient": "optional"
      },
      "no_match_status_map": {
        "recommended": "optional",
        "optional": "optional",
        "inexpedient": "inexpedient"
      },
      "unknown_result": {
        "status": "inherit_system_status",
        "needs_review": true
      },
      "empty_expression_result": {
        "status": "inherit_system_status",
        "needs_review": false
      }
    },
    "reason_codes": {
      "applicability_false": "FUNCTION_NOT_APPLICABLE",
      "applicability_unknown": "FUNCTION_APPLICABILITY_NEEDS_REVIEW",
      "relevance_match": "FUNCTION_RELEVANCE_MATCH",
      "relevance_no_match": "FUNCTION_RELEVANCE_NOT_CONFIRMED",
      "relevance_unknown": "FUNCTION_RELEVANCE_NEEDS_REVIEW",
      "fallback_inherited": "FUNCTION_INHERITED_SYSTEM_STATUS"
    }
  },
  "phase_rules": {
    "version": "function_phase_v1",
    "phase_order": [
      "first",
      "second",
      "later"
    ],
    "candidate_policy": "earliest_phase_wins",
    "promotions_accumulate": false,
    "steps": [
      {
        "order": 10,
        "rule_id": "PHASE_NOT_APPLICABLE",
        "when": {
          "source": "function",
          "field": "status",
          "operator": "equals",
          "value": "not_applicable"
        },
        "result": null,
        "terminal": true
      },
      {
        "order": 20,
        "rule_id": "PHASE_INITIALIZE_DEFAULT",
        "result_from": "functions_catalog.default_phase_priority"
      },
      {
        "order": 30,
        "rule_id": "PHASE_INEXPEDIENT_LATER",
        "when": {
          "source": "function",
          "field": "status",
          "operator": "equals",
          "value": "inexpedient"
        },
        "result": "later",
        "terminal": true
      },
      {
        "order": 40,
        "rule_id": "PHASE_SAFETY_FIRST",
        "all": [
          {
            "source": "function",
            "field": "status",
            "operator": "in",
            "value": [
              "recommended",
              "optional"
            ]
          },
          {
            "source": "factors",
            "field": "safety_criticality",
            "operator": "equals",
            "value": 2
          }
        ],
        "candidate": "first"
      },
      {
        "order": 50,
        "rule_id": "PHASE_DAILY_PROMOTE_ONE",
        "all": [
          {
            "source": "function",
            "field": "status",
            "operator": "equals",
            "value": "recommended"
          },
          {
            "source": "factors",
            "field": "daily_impact",
            "operator": "equals",
            "value": 2
          }
        ],
        "candidate_operation": "promote_default_one_step"
      },
      {
        "order": 60,
        "rule_id": "PHASE_RETROFIT_PROMOTE_ONE",
        "all": [
          {
            "source": "factors",
            "field": "retrofit_penalty",
            "operator": "equals",
            "value": 2
          },
          {
            "source": "questionnaire",
            "field": "project_stage",
            "operator": "in",
            "value": [
              "planning",
              "renovation",
              "reconstruction"
            ]
          }
        ],
        "candidate_operation": "promote_default_one_step"
      },
      {
        "order": 70,
        "rule_id": "PHASE_PREREQUISITE_NORMALIZATION",
        "operation": "set_each_prerequisite_no_later_than_dependent",
        "graph_source": "functions_catalog.prerequisite_function_ids"
      }
    ],
    "user_choice_policy": "recommended_phase is immutable; a user-selected phase is stored separately, then prerequisite normalization is applied visibly to selected choices"
  },
